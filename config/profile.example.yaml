# ================= JobAgent 配置 =================
# 复制本文件为 profile.yaml 后按需修改。网页「设置」页也可以改。

# 目标岗位搜索关键词（BOSS 会逐个关键词搜索，建议 2-4 个）
target_keywords:
  - "AI应用工程师 实习"
  - "大模型应用开发 实习"
  - "AI Agent 实习"
  - "Python后端 实习"

# 目标城市（BOSS 城市码）
# 全国 100010000 / 北京 101010100 / 上海 101020100 / 杭州 101210100
# 南京 101190100 / 深圳 101280600 / 广州 101280100 / 成都 101270100
# 「远程」岗位通过关键词搜索即可，城市码用全国
cities:
  - name: "南京"
    code: "101190100"
  - name: "上海"
    code: "101020100"
  - name: "杭州"
    code: "101210100"

# 薪资过滤（月薪，单位 K，null 表示不限）
salary_min_k: null

# 匹配规则
must_have:                       # 简历里最好具备；JD 明确要求且简历完全不沾边会影响硬判定
  - "Python"
nice_to_have:                    # 加分技能
  - "LangChain"
  - "RAG"
  - "Agent"
  - "FastAPI"
  - "向量数据库"
  - "Prompt工程"
exclude_keywords:                # JD 命中任一即淘汰
  - "销售"
  - "培训贷"
  - "纯标注"
  - "外包驻场"
  - "电话客服"
blacklist_companies: []          # 公司名包含即淘汰，例如 ["某某科技"]

# 打分分档
score_threshold: 75              # >=75 推荐；50-74 可考虑；<50 淘汰
hard_filter_enabled: true

# 采集节奏（拟人化，宁慢勿快）
per_keyword_max_pages: 2         # 每个关键词最多翻几页
detail_page_limit: 60            # 每轮最多打开多少个详情页
browser_headless: false          # 必须 false（有头浏览器更像真人）
min_delay_seconds: 3             # 每个动作后的随机延迟区间
max_delay_seconds: 8

# 定时任务（APScheduler，cron 格式：分 时 日 月 周）
schedule:
  cron:
    - "30 9 * * *"               # 每天 9:30
    - "30 14 * * *"              # 每天 14:30

# LLM（OpenAI 兼容接口；密钥放 secrets.yaml）
llm:
  # DeepSeek 示例：https://api.deepseek.com ，模型名 deepseek-chat
  # 豆包示例：https://ark.cn-beijing.volces.com/api/v3 ，模型名填你的推理接入点 ID
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  temperature: 0.3               # 打分用低温
  greeting_temperature: 0.8      # 话术用高温
  max_tokens: 2000
  timeout_seconds: 60

# 本地向量模型（FastEmbed）
embedding:
  model_name: "BAAI/bge-small-zh-v1.5"
  cache_dir: "data/models"

# 打分权重（final = embedding_weight*向量分 + llm_weight*LLM分）
weights:
  embedding: 0.35
  llm: 0.65

# 话术
greeting:
  count: 3
  max_length: 280                # BOSS 开场白上限
  banned_words: ["微信", "加我", "vx", "VX", "Vx", "v信", "私聊", "QQ", "qq"]

# 推送（密钥/地址放 secrets.yaml）
notify:
  enabled:
    feishu: false
    serverchan: false

# Web 服务
web:
  host: "127.0.0.1"
  port: 8000
